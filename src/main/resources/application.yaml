spring:
  application:
    name: catalogo
  config:
    import: optional:file:${catalogo.env-file:.env}[.properties]
  datasource:
    url: jdbc:postgresql://${CATALOGO_DB_HOST:localhost}:${CATALOGO_DB_PORT:5433}/${CATALOGO_DB_NAME:catalogo}
    username: ${CATALOGO_DB_USER:catalogo}
    password: ${CATALOGO_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${CATALOGO_PORT:8081}
